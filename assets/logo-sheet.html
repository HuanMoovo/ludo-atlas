<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>Ludo Atlas · 品牌资源</title>
<style>
 body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#eceae6;margin:0;padding:28px;color:#222}
 h1{font-size:20px;margin:0 0 6px} .sub{color:#666;font-size:13px;margin-bottom:20px}
 .row{display:flex;gap:20px;flex-wrap:wrap} .card{background:#fff;border-radius:14px;padding:20px;flex:1;min-width:300px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
 .card.dark{background:#131a15} .card h2{font-size:14px;margin:0 0 14px;color:#444} .dark h2{color:#9fb8a4}
 .ck{background-image:conic-gradient(#ddd 25%,#f4f4f4 25% 50%,#ddd 50% 75%,#f4f4f4 75%);background-size:16px 16px;padding:10px;border-radius:8px;display:inline-block}
 img{display:block} img.pix{image-rendering:pixelated} .sizes{display:flex;align-items:flex-end;gap:14px;margin-top:14px}
 .sizes div{text-align:center;font-size:11px;color:#888}
 .sw{display:flex;gap:8px;margin-top:12px} .sw span{width:26px;height:26px;border-radius:6px;display:inline-block;border:1px solid rgba(0,0,0,.08)}
 .pal{font-size:12px;color:#666;margin-top:8px}
</style></head><body>
<h1>Ludo Atlas · 品牌资源</h1>
<div class="sub">主 LOGO：圆润果冻史莱姆（无帽 · 矢量）—— 圆眼、腮红、小微笑与星星点缀 · SVG 矢量 / PNG</div>
<div class="row">
 <div class="card"><h2>主 LOGO（无帽 · 矢量）</h2>
   <span class="ck"><img src="logo.svg" width="200"></span>
   <div class="sizes"><div><img src="logo.svg" width="48"><br>48px</div><div><img src="logo.svg" width="32"><br>32px</div><div><img src="logo.svg" width="16"><br>16px</div></div>
 </div>
 <div class="card"><h2>备选（像素版 · 无帽）</h2>
   <span class="ck"><img class="pix" src="logo-alt.svg" width="200"></span>
   <div class="sizes"><div><img class="pix" src="logo-alt.svg" width="48"><br>48px</div><div><img class="pix" src="logo-alt.svg" width="32"><br>32px</div><div><img class="pix" src="logo-alt.svg" width="16"><br>16px</div></div>
 </div>
</div>
<div class="row" style="margin-top:20px">
 <div class="card dark"><h2>深色背景</h2>
   <span class="ck" style="background:transparent"><img src="logo.svg" width="110"></span>
   <span class="ck" style="background:transparent;margin-left:16px"><img class="pix" src="logo-alt.svg" width="110"></span>
 </div>
 <div class="card"><h2>主色板</h2>
   <div class="sw"><span style="background:#8AF49E"></span><span style="background:#4FDC60"></span><span style="background:#2FB84A"></span><span style="background:#17301E"></span><span style="background:#FF9FB5"></span><span style="background:#FFD75E"></span></div>
   <div class="pal">史莱姆绿渐变 #8AF49E → #4FDC60 → #2FB84A · 眼睛 #17301E · 腮红 #FF9FB5 · 星星 #FFD75E · 高光 #FFFFFF</div>
 </div>
</div>
</body></html>
