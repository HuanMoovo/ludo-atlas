# Ludo Atlas 阅读站配置（Material for MkDocs）。

# 构建流程：python site/prepare.py 生成 site/build → mkdocs build（输出 site/dist）。
# 导航由 site/hooks/gen_nav.py 在构建时按目录结构与索引页顺序自动生成，无需手工维护 nav。

site_name: Ludo Atlas
site_description: 游戏开发全景手册 · 中文优先的开源游戏开发知识库
site_url: https://huanmoovo.github.io/ludo-atlas/
copyright: Ludo Atlas（HuanMoovo）· 文档 CC BY-SA 4.0 · 代码 MIT

docs_dir: site/build
site_dir: site/dist
use_directory_urls: true

repo_url: https://github.com/HuanMoovo/ludo-atlas
repo_name: HuanMoovo/ludo-atlas
edit_uri: ""

hooks:
  - site/hooks/gen_nav.py

theme:
  name: material
  language: zh
  logo: logo.svg
  favicon: logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
